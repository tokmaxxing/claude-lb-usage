name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install checks
        run: |
          python -m pip install ruff
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Validate Python and shell
        run: |
          ruff check .
          shellcheck install.sh
          python -m compileall -q install.py plugins/claude-lb-usage/bin/claude-lb-usage
      - name: Run tests
        run: python -m unittest discover -s tests -v
